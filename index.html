<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Hour</title>
  <meta name="description" content="연말연시를 위한 시간의 방" />
  <meta property="og:title" content="시간의 방" />
  <meta property="og:description" content="연말연시를 위한 시간의 방" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="assets/icons/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="시간의 방" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Gowun+Batang:wght@400;700&family=Marcellus&family=Noto+Serif+KR:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Song+Myung&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>

<body>
  <!-- Starry Background Backdrop -->
  <div class="stars-bg" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Shop Brand & Entrance Header -->
    <header class="shop-header">
      <h1 class="shop-title-main">The Hour</h1>
      <p class="shop-tagline">A Year to Remember, A Year to Discover</p>
      
      <div class="vintage-divider">
        <span>✦ ✧ ✦</span>
      </div>
    </header>

    <!-- Main Atmosphere Intro -->
    <section class="main-hero" aria-label="시간의 방 안내">
      <p class="hero-prose">
        시간의 방에 오신 것을 환영합니다.<br>
        올해와 내년이 만나는 이곳에서 우리들의 시간을 시작합니다.
      </p>
    </section>

    <!-- Three Main Gateway Cards -->
    <main class="portal-grid" role="navigation" aria-label="점술가게 메뉴 선택">
      <!-- Question Portal -->
      <a href="pages/question.html?fresh=1" id="portal-question-btn" class="portal-card question-card-portal" tabindex="0">
        <div class="portal-badge">RETROSPECTIVE</div>
        <div class="portal-icon-wrap" aria-hidden="true">
          <span>📜</span>
        </div>
        <h2 class="portal-title">질문 카드</h2>
        <p class="portal-desc">
          카드에 담긴 질문과 함께, 올해의 기억과 내년의 바람을 나눕니다.
        </p>
      </a>

      <!-- Tarot Portal -->
      <a href="pages/cards.html" id="portal-tarot-btn" class="portal-card tarot-card-portal" tabindex="0">
        <div class="portal-badge">TAROT</div>
        <div class="portal-icon-wrap" aria-hidden="true">
          <span>🔮</span>
        </div>
        <h2 class="portal-title">타로 카드</h2>
        <p class="portal-desc">
          22장의 메이저 아르카나 중에서 마음이 이끄는 카드를 골라 새해의 운세를 확인하세요.
        </p>
      </a>

      <!-- Photo Booth Portal -->
      <a href="pages/photobooth.html" id="portal-photobooth-btn" data-no-spa="true" class="portal-card photobooth-card-portal" tabindex="0">
        <div class="portal-badge">PHOTO BOOTH</div>
        <div class="portal-icon-wrap" aria-hidden="true">
          <span>📸</span>
        </div>
        <h2 class="portal-title">포토 부스</h2>
        <p class="portal-desc">
          특별한 프레임으로 지금의 이 순간을 사진으로 남겨보세요.
        </p>
      </a>
    </main>
  </div>

  <script src="assets/js/audio.js"></script>
  <script src="assets/js/question_data.js"></script>
  <script src="assets/js/tarot_data.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
