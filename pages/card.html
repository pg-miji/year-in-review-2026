<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타로 리딩 결과 - 작은 점술가게</title>
  <meta name="description" content="선택하신 타로 카드의 새해 운세와 조언을 확인하세요." />
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="../assets/icons/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="152x152" href="../assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/card.css" />
</head>

<body>
  <!-- Starry Backdrop -->
  <div class="stars-bg" aria-hidden="true"></div>

  <!-- Page Transition Curtain -->
  <div id="transition-curtain" style="position: fixed; inset: 0; background: #0c0816; opacity: 0; pointer-events: none; transition: opacity 0.22s ease; z-index: 9998;" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="shop-header">
      <a href="../index.html" class="shop-brand" title="홈으로 이동">
        <img src="../assets/images/colorful_logo.svg" alt="작은모임연구소 로고" class="brand-logo-img" onerror="this.src='../assets/images/colorful_logo.png'" />
      </a>
      <h1 class="shop-title-main" style="font-size: 26px;">새해의 전언</h1>
      <div class="vintage-divider" style="margin: 10px auto 14px;">
        <span>✦ ✧ ✦</span>
      </div>
    </header>

    <!-- Main Reading Result Area -->
    <main class="result-workspace" aria-live="polite">
      <article id="reading-card" class="reading-result-card" style="opacity: 0; transition: opacity 0.25s ease;">
        <!-- Left Visual Pane: Card Image without wrapper frame -->
        <div class="result-visual-pane">
          <img id="card-image" src="" alt="선택한 타로 카드" class="result-card-img" />
        </div>

        <!-- Right Content Pane -->
        <div class="result-content-pane">
          <!-- Result Header -->
          <div class="result-header">
            <div id="card-roman" class="result-card-roman"></div>
            <h2 id="card-name-en" class="result-card-title"></h2>
            <div id="card-name-ko" class="result-card-subtitle"></div>
          </div>

          <!-- Keywords Ribbon -->
          <div id="card-keywords" class="result-keywords-container" aria-label="주요 키워드"></div>

          <!-- Reading Body -->
          <div id="card-reading-text" class="reading-text-body"></div>

          <!-- Advice Box -->
          <aside class="advice-box" aria-label="새해를 위한 조언">
            <div class="advice-label">
              <span>✧</span>
              <span>NEW YEAR'S ADVICE</span>
              <span>✧</span>
            </div>
            <p id="card-advice-text" class="advice-content"></p>
          </aside>
        </div>
      </article>

      <!-- Action Buttons -->
      <nav class="result-actions-nav" aria-label="결과 카드 작업 및 네비게이션">
        <button type="button" id="btn-save-souvenir" class="btn-vintage btn-gold">
          <span class="btn-icon">📥</span>
          <span>결과 카드 이미지 저장</span>
        </button>
        <a href="cards.html" class="btn-vintage btn-velvet">
          <span class="btn-icon">🔮</span>
          <span>다른 카드 다시 뽑기</span>
        </a>
        <a href="../index.html" class="btn-vintage btn-velvet btn-home" title="메인 입구로 돌아가기">
          <span class="btn-icon">🏠</span>
          <span>홈</span>
        </a>
      </nav>
    </main>
  </div>

  <!-- Mobile Long-Press / Preview Modal (for mobile browsers where direct download may be restricted in some webviews) -->
  <div id="preview-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-card">
      <h3 id="modal-heading" class="modal-title">✨ 새해 타로 카드 완성</h3>
      <p class="modal-desc">이미지를 꾹 눌러 '사진 앱에 저장'하시거나 아래 버튼을 눌러주세요.</p>
      <img id="modal-preview-img" src="" alt="새해 타로 기념 카드" class="modal-preview-img" />
      <div class="modal-actions">
        <a id="modal-download-btn" href="#" download="new_year_tarot.png" class="btn-vintage btn-gold" style="font-size:14px; padding:10px 20px;">
          ⬇️ 이미지 다운로드
        </a>
        <button type="button" id="modal-close-btn" class="btn-vintage btn-velvet" style="font-size:14px; padding:10px 18px;">
          닫기
        </button>
      </div>
    </div>
  </div>

  <script src="../assets/js/audio.js"></script>
  <script src="../assets/js/tarot_data.js"></script>
  <script src="../assets/js/card.js"></script>
</body>

</html>
