<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>타로 카드 뽑기 - 작은 점술가게</title>
  <meta name="description" content="22장의 메이저 아르카나 타로 카드 중에서 한 장을 골라 새해 운세와 조언을 확인하세요." />
  <meta property="og:title" content="새해를 여는 타로 - 작은 점술가게" />
  <meta property="og:description" content="22장의 메이저 아르카나 중에서 마음에 닿는 한 장을 골라 새해의 운세를 확인하세요." />
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/assets/icons/favicon.ico" type="image/x-icon" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0814" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Gowun+Batang:wght@400;700&family=Marcellus&family=Noto+Serif+KR:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Song+Myung&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <link rel="stylesheet" href="/assets/css/cards.css" />
</head>

<body>
  <!-- Starry Atmosphere Backdrop -->
  <div class="stars-bg" aria-hidden="true"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="shop-header">
      <a href="/index.html" class="shop-brand" title="홈으로 이동">
        <img src="/assets/images/colorful_logo.svg" alt="작은모임연구소 로고" class="brand-logo-img" width="54" height="54" />
      </a>
      <h1 class="shop-title-main">새해를 여는 타로</h1>
      <p class="shop-tagline">다가올 한 해를 생각하며 카드 한 장을 선택하세요</p>
      
      <div class="vintage-divider" style="margin: 12px auto 14px;">
        <span>✦ ✧ ✦</span>
      </div>
    </header>

    <!-- Tarot Deck Selection Section -->
    <main class="tarot-spread-section" aria-label="타로 카드 22장 펼침대">
      <!-- PC Fan Arc Table Layout -->
      <section class="table-stage-desktop" aria-label="데스크톱 타로 펼침 아크">
        <div id="desktop-deck-fan" class="deck-fan-container">
          <!-- 22 Cards dynamically populated with fan math -->
        </div>
      </section>

      <!-- Mobile Layered 3-Row Overlapping Spread -->
      <section class="table-stage-mobile" aria-label="모바일 타로 3열 중첩 펼침">
        <div id="mobile-cards-spread" class="mobile-cards-spread">
          <!-- 3 Overlapping Rows populated dynamically -->
        </div>
      </section>

      <!-- Bottom Navigation -->
      <nav class="cards-bottom-nav">
        <a href="/index.html" class="btn-vintage btn-velvet" title="홈으로 돌아가기">
          <span class="btn-icon">🏠</span>
          <span>홈</span>
        </a>
      </nav>
    </main>
  </div>

  <!-- Mystical Reading Transition Modal -->
  <div id="reading-loading-modal" class="mystical-loading-modal" aria-hidden="true">
    <div class="mystical-loading-card">
      <div class="mystical-orb-wrap">
        <div class="mystical-orb-pulse"></div>
        <div class="mystical-orb-core">✧</div>
      </div>
      <h3 class="mystical-loading-title">카드의 기운을 읽는 중...</h3>
      <p class="mystical-loading-sub">당신을 위한 새해의 메시지를 준비하고 있습니다</p>
    </div>
  </div>

  <script src="/assets/js/images_base64.js"></script>
  <script src="/assets/js/audio.js"></script>
  <script src="/assets/js/tarot_data.js"></script>
  <script src="/assets/js/cards.js"></script>
</body>

</html>
