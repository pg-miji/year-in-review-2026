<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep Velvet Purple Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2c1a45"/>
      <stop offset="60%" stop-color="#180e2b"/>
      <stop offset="100%" stop-color="#0a0514"/>
    </radialGradient>
    
    <!-- Shimmering Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="45%" stop-color="#f3cf7a"/>
      <stop offset="75%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8020"/>
    </linearGradient>

    <!-- Warm Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Outer Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="rgba(212, 175, 55, 0.45)" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Mystical Star / North Star Compass -->
  <g filter="url(#glow)">
    <!-- Primary 8-Point Star -->
    <!-- Vertical & Horizontal Sharp Diamond Rays -->
    <polygon points="32,7 34.8,25 32,23 29.2,25" fill="url(#goldGrad)"/>
    <polygon points="32,57 34.8,39 32,41 29.2,39" fill="url(#goldGrad)"/>
    <polygon points="7,32 25,34.8 23,32 25,29.2" fill="url(#goldGrad)"/>
    <polygon points="57,32 39,34.8 41,32 39,29.2" fill="url(#goldGrad)"/>

    <!-- Diagonal Soft Rays -->
    <polygon points="14,14 27,27 25,29 23,27" fill="#f3cf7a" opacity="0.85"/>
    <polygon points="50,14 37,27 39,29 41,27" fill="#f3cf7a" opacity="0.85"/>
    <polygon points="14,50 27,37 25,35 23,37" fill="#f3cf7a" opacity="0.85"/>
    <polygon points="50,50 37,37 39,35 41,37" fill="#f3cf7a" opacity="0.85"/>

    <!-- Center Core Sparkle -->
    <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>
    <circle cx="32" cy="32" r="3.2" fill="url(#goldGrad)"/>
  </g>

  <!-- Subtle Tiny Stardust -->
  <circle cx="20" cy="18" r="1" fill="#ffeaa7" opacity="0.8"/>
  <circle cx="44" cy="18" r="0.8" fill="#ffffff" opacity="0.75"/>
  <circle cx="18" cy="42" r="0.8" fill="#ffffff" opacity="0.75"/>
  <circle cx="46" cy="44" r="1.1" fill="#ffeaa7" opacity="0.85"/>
</svg>
